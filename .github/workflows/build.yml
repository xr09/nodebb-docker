name: build image and push to GHCR

on:
  # Skip doc-only changes
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  # Weekly rebuild so the node:lts base picks up security fixes
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/nodebb-docker

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # tag repo
      packages: write   # push to ghcr

    # Two images from one Dockerfile. The primary tags stay vanilla so the
    # published image remains site-agnostic; the plugin set this author's forum
    # needs ships beside it under a suffix. PLUGINS is passed here rather than
    # defaulted in the Dockerfile, so a local `docker build` is still vanilla.
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: vanilla
            plugins: ""
            suffix: ""
          - variant: plugins
            plugins: "nodebb-plugin-sso-google@4.0.2 nodebb-plugin-recent-cards@3.3.23"
            suffix: "-plugins"

    steps:
      - uses: actions/checkout@v7

      # Read the pinned NodeBB version out of the Dockerfile so the image tags
      # and the ARG cannot drift. Bumping NodeBB is then a one-line edit and the
      # tags follow automatically.
      - name: Derive version tags
        id: version
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          full="$(grep -m1 '^ARG NODEBB_VERSION=' Dockerfile | cut -d= -f2)"
          full="${full#v}"                    # 4.14.4
          minor="${full%.*}"                  # 4.14
          major="${minor%.*}"                 # 4

          # Only the vanilla build claims the bare version tags and `latest`.
          if [ -z "$SUFFIX" ]; then
            tags="$IMAGE:$full"$'\n'"$IMAGE:$minor"$'\n'"$IMAGE:$major"$'\n'"$IMAGE:latest"
          else
            tags="$IMAGE:${full}${SUFFIX}"$'\n'"$IMAGE:latest${SUFFIX}"
          fi

          # Layer cache, one ref per variant: the two legs run in parallel, and
          # a shared ref would hold whichever finished last. The plugins leg also
          # reads the vanilla ref, since the clone and core npm install are the
          # same layers in both and PLUGINS only starts a later one.
          cache_from="type=registry,ref=$IMAGE:buildcache"
          if [ -n "$SUFFIX" ]; then
            cache_from="$cache_from"$'\n'"type=registry,ref=$IMAGE:buildcache$SUFFIX"
          fi

          echo "full=$full" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<TAGS_EOF"
            echo "$tags"
            echo "TAGS_EOF"
            echo "cache_from<<CACHE_EOF"
            echo "$cache_from"
            echo "CACHE_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Building NodeBB $full (${{ matrix.variant }}), tags:"
          echo "$tags"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4.2.0

      # Skipped on pull_request: PRs from forks get a read-only token, and a PR
      # should prove the image builds without publishing anything.
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          build-args: |
            PLUGINS=${{ matrix.plugins }}
          # mode=max exports the build stage's layers too. An inline cache holds
          # only the final stage, so the clone and the core `npm install` were
          # re-run on every build. Not exported on pull_request: no registry login.
          cache-from: ${{ steps.version.outputs.cache_from }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache{1},mode=max', env.IMAGE, matrix.suffix) || '' }}
          provenance: false
          tags: ${{ steps.version.outputs.tags }}

      # Tag the repo with the version we just published, so git tags track the
      # released images. Only on push (a real release) — schedule/dispatch
      # republish an already-tagged version, and PRs must not tag. Idempotent:
      # a push that does not bump NODEBB_VERSION finds the tag present and skips,
      # and the existing tag is never moved.
      #
      # Restricted to one matrix leg: both legs would otherwise race, both see a
      # 404 for the tag, and both try to create it — one of them failing.
      - name: Tag released version
        if: github.event_name == 'push' && matrix.variant == 'vanilla'
        uses: actions/github-script@v9
        with:
          script: |
            const tag = `v${{ steps.version.outputs.full }}`;
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner, repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
              core.info(`${tag} already exists — leaving it in place`);
            } catch (e) {
              if (e.status !== 404) throw e;
              await github.rest.git.createRef({
                owner: context.repo.owner, repo: context.repo.repo,
                ref: `refs/tags/${tag}`, sha: context.sha,
              });
              core.info(`Created ${tag} at ${context.sha}`);
            }
